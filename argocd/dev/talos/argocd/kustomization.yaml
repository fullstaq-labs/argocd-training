apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: argocd

resources:
  - namespace.yaml
  - ./appprojects/
  - ./appsets/
  - github.repository.yaml
  - selfsigned-ca.secret.yaml

helmCharts:
  - repo: https://argoproj.github.io/argo-helm
    name: argo-cd
    releaseName: argocd
    namespace: argocd
    version: 7.7.0
    valuesFile: values.yaml
