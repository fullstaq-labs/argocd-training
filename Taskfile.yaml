# https://taskfile.dev
version: "3"

includes:
  argocd:
    taskfile: tasks/argocd
    internal: true

  utils:
    taskfile: tasks/utils
    internal: true

  dev:
    taskfile: tasks/dev
    internal: true

dotenv: [".envrc", ".env"]

vars:
  # determines what type of local cluster gets deployed.
  # Currently the only options are "kind", "k3d" or "talos"
  CLUSTER_TYPE: '{{ .CLUSTER_TYPE | default "k3d" }}'

interval: 500ms

silent: true

tasks:
  default: task --list

  up:
    desc: "Deploy entire local development environment."
    # TODO: write a concise summary
    cmds:
      - task: dev:up
      - task: create-aliasses

  destroy:
    desc: "Destroy entire local development environment."
    aliases: [down, destroy, get-rekt]
    cmds:
      - task: dev:destroy

  sync-local:
    desc: "This task watches local changes in the service directory and applies them to the local cluster."
    cmds:
      - task: dev:sync-local

  sync:
    desc: "This task triggers a normal sync for one or more services."
    cmds:
      - task: dev:sync-apps

  sync-all:
    desc: "This task triggers a sync for all services."
    cmds:
      - task: dev:sync-all-apps

  setup-moodle:
    desc: "Pull the Moodle Helm chart for local development"
    vars:
      CHART_REPO: "https://gitlab.avetica.net/kubernetes-platform/helm-charts/moodle-helm-chart.git"
      CHART_PATH: "moodle-base/dev/talos/moodle/charts"
      GIT_REPO_WITH_AUTH: "https://oauth2:{{.PERSONAL_ACCESS_TOKEN}}@gitlab.avetica.net/kubernetes-platform/helm-charts/moodle-helm-chart.git"
    cmds:
      # Remove existing chart if it exists
      - rm -rf {{.CHART_PATH}}

      # Create directory if it doesn't exist
      - mkdir -p {{.CHART_PATH}}

      # Clone the chart repository
      - gum spin --show-error --title "Cloning Moodle Helm chart..." -- git clone {{.GIT_REPO_WITH_AUTH}} {{.CHART_PATH}}

      - gum log --level info "Moodle chart has been pulled to {{.CHART_PATH}}"

      # Create kustomization.yaml if it doesn't exist
      - |
        if [ ! -f moodle-base/dev/talos/moodle/kustomization.yaml ]; then
          cat > moodle-base/dev/talos/moodle/kustomization.yaml << EOF
        apiVersion: kustomize.config.k8s.io/v1beta1
        kind: Kustomization

        helmCharts:
        - name: moodle
          releaseName: moodle
          repo: ./charts/moodle
          version: 1.0.0
          valuesFile: values.yaml

        namespace: moodle
        EOF
          gum log --level info "Created kustomization.yaml"
        fi

  create-aliasses:
    desc: "Create kubectl aliasses"
    cmds:
      - echo "" >> /home/vscode/.bashrc
      - echo "alias k='kubectl'" >> /home/vscode/.bashrc
      - echo "alias kns='kubens'" >> /home/vscode/.bashrc
      - echo "alias kgp='kubectl get pods'" >> /home/vscode/.bashrc
      - echo "alias kgs='kubectl get svc'" >> /home/vscode/.bashrc
      - echo "alias kgn='kubectl get nodes'" >> /home/vscode/.bashrc
      - echo "alias keti='kubectl exec -ti'" >> /home/vscode/.bashrc
      - source /home/vscode/.bashrc
